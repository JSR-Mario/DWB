server:
  port: 8082

spring:
  application:
    name: auth-service
  
  datasource:
    #Cambien aqui por su BD
    url: jdbc:mysql://localhost:3306/dwb_database
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

# Actuator — endpoints para Admin Server
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
